<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdbdbd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#424242;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212121;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="100" cy="52" r="32" fill="url(#bodyGrad)" stroke="#9e9e9e" stroke-width="2"/>
    <!-- Neck -->
    <rect x="88" y="78" width="24" height="18" rx="4" fill="url(#bodyGrad)" stroke="#9e9e9e" stroke-width="1.5"/>
    <!-- Body -->
    <path d="M 60 160 Q 60 105 78 96 L 122 96 Q 140 105 140 160 Z" fill="url(#bodyGrad)" stroke="#9e9e9e" stroke-width="2"/>
    <!-- Collar -->
    <ellipse cx="100" cy="96" rx="30" ry="8" fill="#e8e8e8" stroke="#9e9e9e" stroke-width="1.5"/>
    <!-- Base top -->
    <rect x="52" y="156" width="96" height="12" rx="4" fill="url(#bodyGrad)" stroke="#9e9e9e" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="42" y="166" width="116" height="16" rx="6" fill="url(#bodyGrad)" stroke="#9e9e9e" stroke-width="2"/>
    <!-- Base bottom -->
    <rect x="36" y="178" width="128" height="14" rx="5" fill="url(#shadowGrad)" stroke="#616161" stroke-width="2"/>
  </g>
</svg>
